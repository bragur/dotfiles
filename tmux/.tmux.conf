# Remap prefix from 'C-b' to 'C- '
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix
setw -g mode-keys vi

# Term settings
set -g detach-on-destroy off # Prevents tmux from closing when the terminal is closed
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
# set-option -g default-terminal "tmux-256color"
set-option -sa terminal-features ",tmux-*:RGB"
setw -g monitor-activity on # Notifying if other windows has activities

# Set cursor to | when in insert mode
set -as terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Easy config reloads
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

set -ga update-environment EDITOR

# Allows us to use C-a a <command> to send commands to a TMUX session inside 
# another TMUX session
bind-key a send-prefix
# Renaming
bind-key , command-prompt -p "Name window:" "select-pane -T '%%'"
bind-key + last-window # Back to last window quickly
bind-key m choose-tree -Zw "join-pane -t '%%'" # Merge panes
bind-key b break-pane # Split pane

bind -n M-Right resize-pane -R 2
bind -n M-Left resize-pane -L 2
bind -n M-Up resize-pane -U 1
bind -n M-Down resize-pane -D 1
bind -n M-S-Right resize-pane -R 20
bind -n M-S-Left resize-pane -L 20
bind -n M-S-Up resize-pane -U 10
bind -n M-S-Down resize-pane -D 11

# Smart pane switching with awareness of Neovim splits. -> Smart splits
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# Toggle between layouts
bind-key L run-shell '
  toggle=$(tmux show-option -wqv @layout_toggle);
  if [ "$toggle" = "vertical" ]; then
    tmux select-layout even-horizontal;
    tmux set-option -w @layout_toggle horizontal;
    tmux display-message "Switched to even-horizontal";
  else
    tmux select-layout even-vertical;
    tmux set-option -w @layout_toggle vertical;
    tmux display-message "Switched to even-vertical";
  fi
'
bind-key T select-layout even-horizontal
bind-key C-v select-layout even-vertical

# Copy mode bindings
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\'  'select-pane -L'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\\\'  'select-pane -L'"

# Use C-_ to exit to a new split window
bind-key -n C-_ if -F "#{@pane-is-vim}" 'send-keys C-_' 'select-pane -t 1; resize-pane -Z' 

# Use A-´ to detach
bind-key j run-shell ~/.config/tmux/popuptmux.sh

# Split panes using | and -
bind s split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
unbind [
bind v copy-mode

# Session-x settings
set -g @sessionx-bind 'o' 
set -g @sessionx-pointer "󱞩 "

# Sesh bindings
bind-key "T" run-shell "sesh connect \"$(
	sesh list | fzf-tmux -p 55%,60% \
		--no-sort --border-label ' sesh ' --prompt '⚡  ' \
		--header '  ctrl+a all ctrl+t tmux ctrl+g configs ctrl+x zoxide ctrl+d tmux kill ctrl+f find' \
		--bind 'tab:down,btab:up' \
		--bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list)' \
		--bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
		--bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c)' \
		--bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z)' \
		--bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
		--bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt(⚡  )+reload(sesh list)'
)\""
bind-key "K" display-popup -E -w 45% "sesh connect \"$(
	sesh list -i | gum filter --limit 1 --placeholder 'Pick a sesh' --height 50 --prompt='⚡'
)\""
# Skip the confirmation
bind-key x kill-pane
# Delete scratch terminal for session
set -g popup-style none
set-hook -g session-closed 'run-shell "$HOME/.config/tmux/cleanup.sh #{hook_session_name}"'

# Mouse mode
set -g mouse on
set-option -sg escape-time 0
set-option -g focus-events on

# Ensure blinking bar for tmux
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[5 q'

# Catppuccin settings (must be before loading the plugin)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Status line configuration (after catppuccin loads)
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1
# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on
# Display panes with leader+q and have them display for 3000ms
set-option -g display-panes-time 3000


set -g status-position top

setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
setenv -g EDITOR "nvim"
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[1]' ''
set -g status 2
