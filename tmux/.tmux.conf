# Remap prefix from 'C-b' to 'C- '
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix
setw -g mode-keys vi

# Term settings
set -g detach-on-destroy off # Prevents tmux from closing when the terminal is closed
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
# set-option -g default-terminal "tmux-256color"
set-option -sa terminal-features ",tmux-*:RGB"
setw -g monitor-activity on # Notifying if other windows has activities
set -g allow-passthrough on # Allow DCS passthrough for Ghostty notifications
set -g extended-keys on
set -g extended-keys-format csi-u

# Set cursor to | when in insert mode
set -as terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Easy config reloads
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

set -ga update-environment "EDITOR TERM TERM_PROGRAM TERM_PROGRAM_VERSION"

# Allows us to use C-a a <command> to send commands to a TMUX session inside 
# another TMUX session
bind-key a send-prefix
# Renaming
bind-key , command-prompt -p "Name window:" "rename-window '%%'"
bind-key + last-window # Back to last window quickly
bind-key m choose-tree -Zw "join-pane -t '%%'" # Merge panes
bind-key b break-pane # Split pane

bind -n M-Right resize-pane -R 2
bind -n M-Left resize-pane -L 2
bind -n M-Up resize-pane -U 1
bind -n M-Down resize-pane -D 1
bind -n M-S-Right resize-pane -R 20
bind -n M-S-Left resize-pane -L 20
bind -n M-S-Up resize-pane -U 10
bind -n M-S-Down resize-pane -D 11

# Smart pane switching with awareness of Neovim splits. -> Smart splits
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# Toggle between layouts
bind-key L run-shell '
  toggle=$(tmux show-option -wqv @layout_toggle);
  if [ "$toggle" = "vertical" ]; then
    tmux select-layout even-horizontal;
    tmux set-option -w @layout_toggle horizontal;
    tmux display-message "Switched to even-horizontal";
  else
    tmux select-layout even-vertical;
    tmux set-option -w @layout_toggle vertical;
    tmux display-message "Switched to even-vertical";
  fi
'
bind-key T select-layout even-horizontal
bind-key C-v select-layout even-vertical

# Copy mode bindings
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\'  'select-pane -L'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\\\'  'select-pane -L'"

# Use C-_ to exit to a new split window
bind-key -n C-_ if -F "#{@pane-is-vim}" 'send-keys C-_' 'select-pane -t 1; resize-pane -Z' 

# Floax toggle
set -g @floax-bind 'j'

# Split panes using | and -
bind s split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
unbind [
bind v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Sesh bindings
bind-key "T" run-shell "sesh connect \"$(
	sesh list | fzf-tmux -p 55%,60% \
		--no-sort --border-label ' sesh ' --prompt '⚡  ' \
		--header '  ctrl+a all ctrl+t tmux ctrl+g configs ctrl+x zoxide ctrl+d tmux kill ctrl+f find' \
		--bind 'tab:down,btab:up' \
		--bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list)' \
		--bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
		--bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c)' \
		--bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z)' \
		--bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
		--bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt(⚡  )+reload(sesh list)'
)\""
bind-key "K" display-popup -E -w 45% "sesh connect \"$(
	sesh list -i | gum filter --limit 1 --placeholder 'Pick a sesh' --height 50 --prompt='⚡'
)\""
# Workmux agent dashboard
bind-key C-d display-popup -E -w 60% -h 65% "workmux dashboard"

# Skip the confirmation
bind-key x kill-pane
set -g popup-style none

# Mouse mode
set -g mouse on
set-option -sg escape-time 0
set-option -g focus-events on

# Ensure blinking bar for tmux
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[5 q'

# Catppuccin settings (must be before the plugin loads)
set -g @catppuccin_flavor "mocha"
# "custom" leaves the separators below untouched — the built-in styles overwrite
# them. Rounded left cap, flat right edge so workmux's trailing status icon isn't
# squeezed into the curve.
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator "#[fg=#{@_ctp_status_bg},reverse]█#[none]"
# The plugin only derives the *_current_* separators when they are unset, so a
# reload of a running server would keep the previous values.
set -g @catppuccin_window_current_left_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator "#[fg=#{@_ctp_status_bg},reverse]█#[none]"
# The number sits directly against the rounded cap, so it needs its own leading
# space to look centred. workmux's status icon is placed inside the pill here
# (needs `status_format: false` in ~/.config/workmux/config.yaml, otherwise
# workmux appends it after the right edge via a per-window format override).
set -g @catppuccin_window_number " #I"
set -g @catppuccin_window_current_number " #I"
# workmux names windows after the full branch, which runs to 70+ characters and
# crowds every other window off the bar. Shorten only the *display*: the real
# window name is untouched, so workmux's hooks still resolve windows by name.
# `s|bragi-||` drops the branch author prefix, `=/n/…` caps the rest; the
# focused window gets a longer budget since it's the one worth reading.
set -g @catppuccin_window_text " #{=/16/…:#{s|bragi-||:#{window_name}}}#{?@workmux_status, #{@workmux_status},} "
set -g @catppuccin_window_current_text " #{=/30/…:#{s|bragi-||:#{window_name}}}#{?@workmux_status, #{@workmux_status},} "
set -g @catppuccin_host_text " #(scutil --get LocalHostName)"

# Load catppuccin first so status modules are available
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Status line configuration (must be after catppuccin, before cpu/battery plugins)
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#{?client_prefix,#{@thm_red},#{@thm_green}},bg=default]#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_green}}]  #[fg=#{?client_prefix,#{@thm_red},#{@thm_green}},bg=#{@thm_surface_0}]#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #S #[fg=#{@thm_surface_0},bg=default]#[bg=default] "
# Claude usage as a Catppuccin half-pill (robot icon + compact usage). Built
# inline (not via the module template) so it references catppuccin's separators
# and @thm_* palette at render time, after catppuccin's async load — matching the
# host/battery pills and following any theme/separator changes.
set -g status-right "#[fg=#{E:@thm_mauve}]#{E:@catppuccin_status_left_separator}#[fg=#{E:@thm_crust},bg=#{E:@thm_mauve}]󰚩 #[fg=#{E:@thm_fg},bg=#{E:@catppuccin_status_module_text_bg}] #(~/.config/tmux/claude-usage.sh)#[fg=#{E:@catppuccin_status_module_text_bg}]#{E:@catppuccin_status_right_separator}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_battery}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'docker-run/tmux-claude-usage'

# Claude usage harvester options (read by ~/.config/tmux/claude-usage.sh). Reads
# local Claude Code usage data — no API calls. Colour/pill styling is handled by
# the @catppuccin_claude_usage_* module above. Run scripts/init.sh after `prefix + I`.
set -g @claude_usage_show 'session'
set -g @claude_usage_show_bar 'on'
set -g @claude_usage_bar_width '5'

# Resurrect: restore pane scrollback, and restore claude panes as a marker
# (not an auto-resume — pick `claude --continue` or `claude --resume` per pane)
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~claude->echo claude was running here: claude --continue (latest) or claude --resume (pick)"'

# Continuum: auto-save every 15 min, auto-restore on server start
set -g @continuum-restore 'on'

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1
# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on
# Prevent windows from auto-renaming to the running command
set-option -g automatic-rename off
set-option -g allow-rename off
# Display panes with leader+q and have them display for 3000ms
set-option -g display-panes-time 3000

set -g status-position top

setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
setenv -g EDITOR "nvim"
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g status-style "bg=default"

# Override battery icon/text to use direct script calls (catppuccin's #{l:} prevents shell evaluation)
set -g @catppuccin_battery_icon "#(~/.tmux/plugins/tmux-battery/scripts/battery_icon.sh) "
set -g @catppuccin_battery_text " #(~/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh) "

# Hide battery module entirely on devices without a battery
if-shell '! pmset -g batt | grep -q InternalBattery' \
    'set -g @catppuccin_status_battery ""'
