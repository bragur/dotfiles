## Atuin configuration
## See: https://docs.atuin.sh/configuration/config/

## Sync settings
auto_sync = true
sync_frequency = "30m"
sync_address = "https://api.atuin.sh"

## UI settings
enter_accept = false
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "directory"

## Enable sync v2
[sync]
records = true
