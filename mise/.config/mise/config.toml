# mise global configuration
# See: https://mise.jdx.dev/configuration.html

[tools]
node = "24"
python = "3"
rust = "1.91.0"
yarn = "1"
bun = "latest"
"npm:@tobilu/qmd" = "latest"
"npm:pnpm" = "11.1.1"
go = "1.27"
"github:basecamp/hey-cli" = "latest"
golangci-lint = "2.13.2"
"npm:xcodebuildmcp" = "latest"
protoc = "27.3"
protoc-gen-go = "1.34.2"
protoc-gen-go-grpc = "1.5.1"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
